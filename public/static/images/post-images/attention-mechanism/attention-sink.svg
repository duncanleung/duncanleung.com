<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .axis-label { font-size: 11px; fill: #666; }
    .tick-label { font-size: 10px; fill: #888; }
    .annotation { font-size: 11px; font-weight: 600; }
    .annotation-sub { font-size: 10px; fill: #666; }
  </style>

  <!-- Background -->
  <rect width="680" height="360" fill="#fafaf7" rx="8"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" class="title">Attention Sink: Where Excess Attention Probability Goes</text>
  <text x="340" y="44" text-anchor="middle" class="annotation-sub">Llama-2-7B, 4096-token sequence (Xiao et al. 2023)</text>

  <!-- Chart area: x=80..640, y=65..280 -->
  <!-- Y axis -->
  <line x1="80" y1="65" x2="80" y2="280" stroke="#ccc" stroke-width="1"/>
  <!-- X axis -->
  <line x1="80" y1="280" x2="640" y2="280" stroke="#ccc" stroke-width="1"/>

  <!-- Y grid and labels -->
  <line x1="80" y1="77" x2="640" y2="77" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="81" text-anchor="end" class="tick-label">55%</text>
  <line x1="80" y1="116" x2="640" y2="116" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="120" text-anchor="end" class="tick-label">45%</text>
  <line x1="80" y1="155" x2="640" y2="155" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="159" text-anchor="end" class="tick-label">35%</text>
  <line x1="80" y1="194" x2="640" y2="194" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="198" text-anchor="end" class="tick-label">25%</text>
  <line x1="80" y1="233" x2="640" y2="233" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="237" text-anchor="end" class="tick-label">15%</text>
  <line x1="80" y1="272" x2="640" y2="272" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="276" text-anchor="end" class="tick-label">5%</text>

  <!-- X labels -->
  <text x="104" y="296" text-anchor="middle" class="tick-label">1</text>
  <text x="147" y="296" text-anchor="middle" class="tick-label">2</text>
  <text x="191" y="296" text-anchor="middle" class="tick-label">3</text>
  <text x="235" y="296" text-anchor="middle" class="tick-label">4</text>
  <text x="278" y="296" text-anchor="middle" class="tick-label">5</text>
  <text x="440" y="296" text-anchor="middle" class="tick-label">…</text>
  <text x="596" y="296" text-anchor="middle" class="tick-label">4096</text>

  <!-- Axis titles -->
  <text x="360" y="316" text-anchor="middle" class="axis-label">Token Position</text>
  <text x="25" y="172" text-anchor="middle" class="axis-label" transform="rotate(-90 25 172)">Attention Weight (%)</text>

  <!-- Bars -->
  <!-- Token 1: >50% — the sink -->
  <rect x="88" y="81" width="32" height="199" fill="#B8453A" rx="2" opacity="0.9"/>
  <!-- Token 2: ~8% -->
  <rect x="131" y="249" width="32" height="31" fill="#2A6B7C" rx="2" opacity="0.6"/>
  <!-- Token 3: ~5% -->
  <rect x="175" y="261" width="32" height="19" fill="#2A6B7C" rx="2" opacity="0.5"/>
  <!-- Token 4: ~3% -->
  <rect x="219" y="269" width="32" height="11" fill="#2A6B7C" rx="2" opacity="0.4"/>
  <!-- Token 5: ~2% -->
  <rect x="262" y="273" width="32" height="7" fill="#2A6B7C" rx="2" opacity="0.35"/>
  <!-- Tokens 6-8 -->
  <rect x="306" y="275" width="32" height="5" fill="#2A6B7C" rx="2" opacity="0.3"/>
  <rect x="349" y="276" width="32" height="4" fill="#2A6B7C" rx="2" opacity="0.25"/>
  <rect x="393" y="277" width="32" height="3" fill="#2A6B7C" rx="2" opacity="0.2"/>
  <!-- ... gap -->
  <!-- Tokens near end: slight uptick -->
  <rect x="480" y="276" width="32" height="4" fill="#2A6B7C" rx="2" opacity="0.22"/>
  <rect x="524" y="275" width="32" height="5" fill="#2A6B7C" rx="2" opacity="0.28"/>
  <rect x="567" y="274" width="32" height="6" fill="#2A6B7C" rx="2" opacity="0.35"/>
  <rect x="611" y="272" width="32" height="8" fill="#2A6B7C" rx="2" opacity="0.4"/>

  <!-- Annotation: token 1 -->
  <text x="104" y="72" text-anchor="middle" class="annotation" fill="#B8453A">&gt;50%</text>
  <line x1="104" y1="75" x2="104" y2="80" stroke="#B8453A" stroke-width="1"/>

  <!-- Callout box -->
  <rect x="310" y="115" width="310" height="72" fill="#fff" rx="4" stroke="#ddd"/>
  <text x="320" y="134" class="annotation" fill="#B8453A" style="font-size:11px;">The "attention sink"</text>
  <text x="320" y="151" class="annotation-sub" style="font-size:10px;">Token 1 absorbs &gt;50% of total attention weight.</text>
  <text x="320" y="166" class="annotation-sub" style="font-size:10px;">Its content doesn't matter — replacing it with a</text>
  <text x="320" y="181" class="annotation-sub" style="font-size:10px;">newline barely changes perplexity (5.40 → 5.60).</text>

  <!-- Arrow from callout to bar -->
  <line x1="310" y1="150" x2="125" y2="150" stroke="#B8453A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#B8453A"/>
    </marker>
  </defs>

  <!-- Bottom annotation -->
  <rect x="120" y="334" width="440" height="20" fill="#F5E6E3" rx="3"/>
  <text x="340" y="349" text-anchor="middle" style="font-size:10px;fill:#B8453A;font-weight:600;">Removing the sink token causes catastrophic collapse: perplexity 5.40 → 5,158</text>
</svg>