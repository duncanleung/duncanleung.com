<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .label { font-size: 12px; fill: #1a1a2e; }
    .label-small { font-size: 10px; fill: #555; }
    .label-desc { font-size: 11px; fill: #666; font-style: italic; }
    .box { stroke-width: 1.5; rx: 6; ry: 6; }
    .arrow { stroke: #888; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .arrow-bold { stroke: #2A6B7C; stroke-width: 2; fill: none; marker-end: url(#arrowhead-bold); }
    .connector { stroke: #ccc; stroke-width: 1; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arrowhead-bold" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2A6B7C"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#fafaf7" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" class="title">Self-Attention: The Query-Key-Value Pipeline</text>

  <!-- Input tokens -->
  <rect x="30" y="70" width="80" height="32" fill="#E8E4DC" class="box" stroke="#aaa"/>
  <text x="70" y="91" text-anchor="middle" class="label">Token₁</text>
  <rect x="30" y="112" width="80" height="32" fill="#E8E4DC" class="box" stroke="#aaa"/>
  <text x="70" y="133" text-anchor="middle" class="label">Token₂</text>
  <rect x="30" y="154" width="80" height="32" fill="#E8E4DC" class="box" stroke="#aaa"/>
  <text x="70" y="175" text-anchor="middle" class="label">Token₃</text>
  <rect x="30" y="196" width="80" height="32" fill="#E8E4DC" class="box" stroke="#aaa"/>
  <text x="70" y="217" text-anchor="middle" class="label">…</text>

  <text x="70" y="60" text-anchor="middle" class="label-small">Input Embeddings</text>

  <!-- Three projection arrows -->
  <line x1="110" y1="86" x2="175" y2="86" class="arrow"/>
  <line x1="110" y1="128" x2="175" y2="170" class="arrow"/>
  <line x1="110" y1="170" x2="175" y2="260" class="arrow"/>

  <!-- Q, K, V boxes -->
  <rect x="175" y="60" width="90" height="50" fill="#D4E8ED" class="box" stroke="#2A6B7C"/>
  <text x="220" y="82" text-anchor="middle" class="label" fill="#2A6B7C" font-weight="600">Q</text>
  <text x="220" y="100" text-anchor="middle" class="label-small">Query</text>

  <rect x="175" y="145" width="90" height="50" fill="#E8D4D4" class="box" stroke="#B8453A"/>
  <text x="220" y="167" text-anchor="middle" class="label" fill="#B8453A" font-weight="600">K</text>
  <text x="220" y="185" text-anchor="middle" class="label-small">Key</text>

  <rect x="175" y="235" width="90" height="50" fill="#D4E8D4" class="box" stroke="#3A7D5C"/>
  <text x="220" y="257" text-anchor="middle" class="label" fill="#3A7D5C" font-weight="600">V</text>
  <text x="220" y="275" text-anchor="middle" class="label-small">Value</text>

  <!-- Descriptions -->
  <text x="140" y="322" class="label-desc">"What am I looking for?"</text>
  <text x="140" y="342" class="label-desc">"What information do I have?"</text>
  <text x="140" y="362" class="label-desc">"What should I transmit?"</text>
  <circle cx="133" cy="318" r="4" fill="#2A6B7C"/>
  <circle cx="133" cy="338" r="4" fill="#B8453A"/>
  <circle cx="133" cy="358" r="4" fill="#3A7D5C"/>

  <!-- QKᵀ multiplication -->
  <line x1="265" y1="85" x2="330" y2="130" class="arrow-bold"/>
  <line x1="265" y1="170" x2="330" y2="140" class="arrow-bold"/>

  <rect x="330" y="110" width="100" height="50" fill="#fff" class="box" stroke="#2A6B7C" stroke-width="2"/>
  <text x="380" y="132" text-anchor="middle" class="label" fill="#2A6B7C" font-weight="600">Q · Kᵀ</text>
  <text x="380" y="149" text-anchor="middle" class="label-small">dot product</text>

  <!-- Scale -->
  <line x1="430" y1="135" x2="470" y2="135" class="arrow-bold"/>
  <rect x="470" y="110" width="100" height="50" fill="#fff" class="box" stroke="#2A6B7C" stroke-width="2"/>
  <text x="520" y="130" text-anchor="middle" class="label" fill="#2A6B7C" font-weight="600">÷ √d_k</text>
  <text x="520" y="149" text-anchor="middle" class="label-small">scale</text>

  <!-- Softmax -->
  <line x1="520" y1="160" x2="520" y2="195" class="arrow-bold"/>
  <rect x="470" y="195" width="100" height="50" fill="#F5E6C8" class="box" stroke="#A07D28" stroke-width="2"/>
  <text x="520" y="217" text-anchor="middle" class="label" fill="#A07D28" font-weight="600">softmax</text>
  <text x="520" y="235" text-anchor="middle" class="label-small">Σ weights = 1</text>

  <!-- Attention weights label -->
  <text x="520" y="262" text-anchor="middle" class="label-small" fill="#A07D28">attention weights</text>

  <!-- Multiply by V -->
  <line x1="520" y1="268" x2="520" y2="298" class="arrow-bold"/>
  <line x1="265" y1="260" x2="470" y2="310" class="arrow" stroke="#3A7D5C"/>

  <rect x="470" y="298" width="100" height="50" fill="#fff" class="box" stroke="#2A6B7C" stroke-width="2"/>
  <text x="520" y="318" text-anchor="middle" class="label" fill="#2A6B7C" font-weight="600">× V</text>
  <text x="520" y="336" text-anchor="middle" class="label-small">weighted sum</text>

  <!-- Output -->
  <line x1="570" y1="323" x2="620" y2="323" class="arrow-bold"/>
  <rect x="620" y="298" width="80" height="50" fill="#2A6B7C" class="box" stroke="#1E5563"/>
  <text x="660" y="320" text-anchor="middle" class="label" fill="#fff" font-weight="600">Output</text>
  <text x="660" y="337" text-anchor="middle" style="font-size:10px;fill:#c0dce3;">context-aware</text>

  <!-- Formula at bottom -->
  <rect x="160" y="385" width="400" height="28" fill="#f0ede6" rx="4" stroke="#d5d0c8"/>
  <text x="360" y="404" text-anchor="middle" style="font-family:monospace;font-size:12px;fill:#1a1a2e;">Attention(Q, K, V) = softmax(Q·Kᵀ / √d_k) · V</text>
</svg>