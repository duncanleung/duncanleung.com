<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .axis-label { font-size: 11px; fill: #666; }
    .tick-label { font-size: 10px; fill: #888; }
    .annotation { font-size: 11px; font-weight: 600; }
    .annotation-sub { font-size: 10px; fill: #666; }
  </style>
  <defs>
    <linearGradient id="rope-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A6B7C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2A6B7C" stop-opacity="0.01"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="680" height="380" fill="#fafaf7" rx="8"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" class="title">RoPE Distance Decay: Q·K Inner Product vs. Token Distance</text>
  <text x="340" y="44" text-anchor="middle" class="annotation-sub">Non-monotonic oscillation within a decaying envelope (Su et al. 2021)</text>

  <!-- Chart area: x=80..640, y=65..290 -->
  <line x1="80" y1="65" x2="80" y2="290" stroke="#ccc" stroke-width="1"/>
  <line x1="80" y1="290" x2="640" y2="290" stroke="#ccc" stroke-width="1"/>

  <!-- Y grid and labels -->
  <line x1="80" y1="75" x2="640" y2="75" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="79" text-anchor="end" class="tick-label">20</text>
  <line x1="80" y1="129" x2="640" y2="129" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="133" text-anchor="end" class="tick-label">15</text>
  <line x1="80" y1="183" x2="640" y2="183" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="187" text-anchor="end" class="tick-label">10</text>
  <line x1="80" y1="237" x2="640" y2="237" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="241" text-anchor="end" class="tick-label">5</text>
  <text x="72" y="294" text-anchor="end" class="tick-label">0</text>

  <!-- X labels -->
  <text x="80" y="308" text-anchor="middle" class="tick-label">0</text>
  <text x="192" y="308" text-anchor="middle" class="tick-label">50</text>
  <text x="304" y="308" text-anchor="middle" class="tick-label">100</text>
  <text x="416" y="308" text-anchor="middle" class="tick-label">150</text>
  <text x="528" y="308" text-anchor="middle" class="tick-label">200</text>
  <text x="640" y="308" text-anchor="middle" class="tick-label">250</text>

  <!-- Axis titles -->
  <text x="360" y="330" text-anchor="middle" class="axis-label">Relative Distance Between Tokens</text>
  <text x="22" y="180" text-anchor="middle" class="axis-label" transform="rotate(-90 22 180)">Q·K Inner Product</text>

  <!-- Decay envelope (dashed) -->
  <polyline fill="none" stroke="#2A6B7C" stroke-width="1" stroke-dasharray="4 3" stroke-opacity="0.4"
    points="80,75 124,97 168,116 212,132 256,145 300,156 344,165 388,172 432,178 476,183 520,187 564,190 608,193 640,195"/>
  <polyline fill="none" stroke="#2A6B7C" stroke-width="1" stroke-dasharray="4 3" stroke-opacity="0.4"
    points="80,75 124,148 168,173 212,190 256,203 300,213 344,220 388,225 432,229 476,233 520,236 564,238 608,240 640,241"/>

  <!-- Area fill between envelopes -->
  <polygon fill="url(#rope-area)"
    points="80,75 124,97 168,116 212,132 256,145 300,156 344,165 388,172 432,178 476,183 520,187 564,190 608,193 640,195
            640,241 608,240 564,238 520,236 476,233 432,229 388,225 344,220 300,213 256,203 212,190 168,173 124,148 80,75"/>

  <!-- Oscillating signal line -->
  <polyline fill="none" stroke="#2A6B7C" stroke-width="2" stroke-linejoin="round"
    points="80,75
            92,120 102,95 116,140 128,108 142,155 154,125 168,165 180,140
            194,172 206,148 220,180 232,158 246,185 258,165 272,190 284,172
            298,192 310,178 324,196 336,184 350,200 362,188 376,202 388,193
            402,206 414,198 428,210 440,202 454,213 466,206 480,216 492,210
            506,218 518,213 530,220 542,216 556,223 568,218 580,225 592,220
            606,226 618,222 634,228 640,224"/>

  <!-- Key data points -->
  <circle cx="80" cy="75" r="4" fill="#2A6B7C"/>
  <circle cx="640" cy="224" r="4" fill="#2A6B7C"/>

  <!-- Annotations -->
  <text x="100" y="68" class="annotation" fill="#2A6B7C">~20</text>
  <text x="100" y="80" class="annotation-sub" style="font-size:9px;">all dims contribute</text>
  <text x="560" y="250" class="annotation" fill="#2A6B7C">~8</text>
  <text x="560" y="262" class="annotation-sub" style="font-size:9px;">high-freq dims = noise</text>

  <!-- Arrow showing decay direction -->
  <line x1="190" y1="100" x2="520" y2="200" stroke="#B8453A" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.5" marker-end="url(#decay-arr)"/>
  <defs>
    <marker id="decay-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#B8453A" opacity="0.5"/>
    </marker>
  </defs>
  <text x="370" y="138" text-anchor="middle" class="annotation" fill="#B8453A" opacity="0.7" style="font-size:11px;">overall decay trend</text>

  <!-- Bottom callouts -->
  <rect x="80" y="348" width="260" height="22" fill="#D4E8ED" rx="3"/>
  <text x="210" y="363" text-anchor="middle" style="font-size:10px;fill:#2A6B7C;font-weight:600;">Short distance: all dimensions useful</text>

  <rect x="380" y="348" width="260" height="22" fill="#F5E6E3" rx="3"/>
  <text x="510" y="363" text-anchor="middle" style="font-size:10px;fill:#B8453A;font-weight:600;">Long distance: ~25% of dims wasted</text>
</svg>