<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .axis-label { font-size: 11px; fill: #666; }
    .tick-label { font-size: 10px; fill: #888; }
    .annotation { font-size: 11px; fill: #1a1a2e; font-weight: 600; }
    .annotation-sub { font-size: 10px; fill: #666; }
  </style>
  <defs>
    <linearGradient id="area-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A6B7C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2A6B7C" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="680" height="380" fill="#fafaf7" rx="8"/>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" class="title">The U-Shaped Curve: Accuracy by Information Position</text>
  <text x="340" y="44" text-anchor="middle" class="annotation-sub">GPT-3.5-Turbo, 20-document multi-document QA (Liu et al. 2023)</text>

  <!-- Chart area: x=80..640, y=65..310 -->
  <!-- Y axis -->
  <line x1="80" y1="65" x2="80" y2="310" stroke="#ccc" stroke-width="1"/>
  <!-- X axis -->
  <line x1="80" y1="310" x2="640" y2="310" stroke="#ccc" stroke-width="1"/>

  <!-- Y grid lines and labels -->
  <line x1="80" y1="80" x2="640" y2="80" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="84" text-anchor="end" class="tick-label">80%</text>
  <line x1="80" y1="126" x2="640" y2="126" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="130" text-anchor="end" class="tick-label">70%</text>
  <line x1="80" y1="172" x2="640" y2="172" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="176" text-anchor="end" class="tick-label">60%</text>
  <line x1="80" y1="218" x2="640" y2="218" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="222" text-anchor="end" class="tick-label">50%</text>
  <line x1="80" y1="264" x2="640" y2="264" stroke="#eee" stroke-width="0.5"/>
  <text x="72" y="268" text-anchor="end" class="tick-label">40%</text>

  <!-- X labels -->
  <text x="108" y="328" text-anchor="middle" class="tick-label">1</text>
  <text x="192" y="328" text-anchor="middle" class="tick-label">4</text>
  <text x="276" y="328" text-anchor="middle" class="tick-label">7</text>
  <text x="360" y="328" text-anchor="middle" class="tick-label">10</text>
  <text x="444" y="328" text-anchor="middle" class="tick-label">13</text>
  <text x="528" y="328" text-anchor="middle" class="tick-label">16</text>
  <text x="612" y="328" text-anchor="middle" class="tick-label">20</text>

  <!-- Axis titles -->
  <text x="360" y="350" text-anchor="middle" class="axis-label">Position of relevant document (of 20)</text>
  <text x="25" y="188" text-anchor="middle" class="axis-label" transform="rotate(-90 25 188)">Accuracy (%)</text>

  <!-- Closed-book baseline -->
  <line x1="80" y1="195" x2="640" y2="195" stroke="#B8453A" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="644" y="192" class="tick-label" fill="#B8453A">56.1%</text>
  <text x="644" y="204" class="tick-label" fill="#B8453A">no context</text>

  <!-- Area fill under curve -->
  <!-- Points: 20 positions mapped to x=108..612, y mapped from accuracy -->
  <!-- Accuracies (approximate from paper): 75.8, 73, 70, 67, 64, 61, 58, 56, 54.5, 53.8, 54, 55, 56, 57.5, 59, 60.5, 61.5, 62, 62.5, 63.2 -->
  <polygon fill="url(#area-fill)"
    points="108,100 134,107 161,117 187,131 213,144 240,158 266,172 293,181 319,188 345,191
            371,190 398,186 424,181 450,174 477,166 503,159 529,153 556,148 584,145 612,141
            612,310 108,310"/>

  <!-- Line -->
  <polyline fill="none" stroke="#2A6B7C" stroke-width="2.5" stroke-linejoin="round"
    points="108,100 134,107 161,117 187,131 213,144 240,158 266,172 293,181 319,188 345,191
            371,190 398,186 424,181 450,174 477,166 503,159 529,153 556,148 584,145 612,141"/>

  <!-- Key data points -->
  <circle cx="108" cy="100" r="5" fill="#2A6B7C"/>
  <circle cx="345" cy="191" r="5" fill="#B8453A"/>
  <circle cx="612" cy="141" r="5" fill="#2A6B7C"/>

  <!-- Annotations -->
  <text x="108" y="90" text-anchor="middle" class="annotation" fill="#2A6B7C">75.8%</text>
  <text x="345" y="210" text-anchor="middle" class="annotation" fill="#B8453A">53.8%</text>
  <text x="345" y="224" text-anchor="middle" class="annotation-sub" fill="#B8453A">below no-context baseline</text>
  <text x="612" y="133" text-anchor="middle" class="annotation" fill="#2A6B7C">63.2%</text>

  <!-- Zone labels at bottom -->
  <rect x="90" y="355" width="110" height="18" fill="#D4E8ED" rx="3"/>
  <text x="145" y="368" text-anchor="middle" style="font-size:10px;fill:#2A6B7C;font-weight:600;">Strong attention</text>

  <rect x="285" y="355" width="150" height="18" fill="#F5E6E3" rx="3"/>
  <text x="360" y="368" text-anchor="middle" style="font-size:10px;fill:#B8453A;font-weight:600;">The "dumb zone"</text>

  <rect x="500" y="355" width="110" height="18" fill="#D4E8ED" rx="3"/>
  <text x="555" y="368" text-anchor="middle" style="font-size:10px;fill:#2A6B7C;font-weight:600;">Strong attention</text>
</svg>